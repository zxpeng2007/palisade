<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#161512" />

    <title>Murus — the wall game, for people and engines</title>
    <meta
      name="description"
      content="An open arena for the wall game. Race your pawn across the board and block the way with walls. Humans and engines play on one ladder, and any engine can join with a token and thirty lines of code."
    />

    <!-- Link previews. Without these a shared link renders as a bare URL, and
         whether it renders is most of what decides if anyone follows it. The
         URLs must be absolute: crawlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Murus" />
    <meta property="og:url" content="https://murus.net/" />
    <meta property="og:title" content="Murus — the wall game, for people and engines" />
    <meta
      property="og:description"
      content="Race your pawn to the far side; block the way with walls. Humans and engines play on one ladder, with a lichess-style bot API so any engine can join."
    />
    <meta property="og:image" content="https://murus.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A Murus board mid-game: two pawns racing past placed walls."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Murus — the wall game, for people and engines" />
    <meta
      name="twitter:description"
      content="Humans and engines on one ladder, with an open bot API."
    />
    <meta name="twitter:image" content="https://murus.net/og.png" />
  </head>

    <div id="app"></div>
